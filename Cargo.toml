[package]
name = "pkg-merge"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Une las piezas de un PKG de PS4/PS5 usando el manifiesto oficial"
default-run = "pkg-merge"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
indicatif = "0.17"
rayon = "1.10"
ctrlc = "3.4"
fs2 = "0.4"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
